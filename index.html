button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.header{

}
.brand{display:flex;gap:10px;align-items:center;min-width:240px}

.mode-switch button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.select,.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}
.theme-btn{display:flex;align-items:center;gap:7px;font-weight:600}
.theme-orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}

.app{display:grid;grid-template-columns:210px minmax(0,1fr)}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}

.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}

.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}
.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}
.main{min-width:0;padding:20px 24px 44px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}
.page-desc{margin:0;max-width:820px;color:var(--ink-2);font-size:.69rem;line-height:1.45}
.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}
.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}
.card.feature{box-shadow:var(--shadow)}
.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.kpi{display:flex;justify-content:space-between;gap:7px}
.kpi-value{font:600 1.33rem/.95 var(--serif)}
.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}
.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}
.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}
.chart-wrap{position:relative}
.chart{width:100%;height:205px;display:block;overflow:visible}
.chart-sm{height:145px}
.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}
.tick{fill:var(--ink-3);font:8px var(--mono)}
.band{fill:var(--warn-dim);opacity:.85}
.band-risk{fill:var(--risk-dim);opacity:.8}
.bar-base{fill:var(--blue)}.bar-eac{fill:var(--gold)}.bar-soft{fill:var(--surface-deep)}
.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.line-gold{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tooltip{
  position:fixed;z-index:1000;pointer-events:none;min-width:150px;max-width:260px;padding:8px 9px;border-radius:7px;
  background:var(--ink);color:var(--surface);font-size:.57rem;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none
}
.tooltip strong{display:block;margin-bottom:3px;font-size:.6rem}
.hoverable{cursor:help}

.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}
.status-strip{display:flex;height:20px;border-radius:7px;overflow:hidden;border:1px solid var(--border);background:var(--surface-deep)}
.status-seg{height:100%}.status-seg.ok{background:var(--ok)}.status-seg.warn{background:var(--warn)}.status-seg.bad{background:var(--risk)}

.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}
.program-matrix{display:grid;gap:5px;margin-top:10px}
.program-row{display:grid;grid-template-columns:72px 1fr;gap:7px;align-items:center;min-height:26px}
.program-name{font:400 .47rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.program-heat{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.program-chip{min-width:40px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);text-align:center;background:var(--surface-alt);position:relative}

.kpi-help{cursor:help}

.guide-pulse{animation:guide-pulse 1s ease-in-out 0s 2}

.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}
.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}

.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}
.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}

.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{text-align:left}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}
.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}
.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px;background:var(--surface)}
th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}
tbody tr:last-child td{border-bottom:0}tbody tr.click:hover{background:var(--surface-alt);cursor:pointer}
.milestone-grid{display:grid;grid-template-columns:135px 1fr;gap:7px}.mname{font-size:.58rem;color:var(--ink-2);display:flex;align-items:center}.mline{position:relative;height:35px;background:var(--surface-alt);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.mbase{position:absolute;left:7%;top:11px;height:10px;border-radius:999px;background:var(--surface-deep)}.mactual{position:absolute;left:7%;top:11px;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}
.mlabel{position:absolute;right:7px;top:8px;font:400 .48rem/1 var(--mono);color:var(--ink-2)}
.note{font-size:.54rem;color:var(--ink-3);line-height:1.45;margin-top:6px}
.crosslink{display:inline-flex;align-items:center;gap:5px;margin-top:7px;border:1px solid var(--accent-mid);background:var(--accent-dim);color:var(--accent);border-radius:6px;padding:5px 7px;font-size:.54rem;font-weight:700}
@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}

</style>
</head>

function money(n){return n.toFixed(1)+"k hrs"}
function statusClass(s){if(["Adopted","Complete","Certified","Low","On track","Pass","Production"].includes(s))return"good";if(["At Risk","Conditional","Medium","At risk","Not yet due","Pilot","Prototype"].includes(s))return"warn";return"bad"}
function badge(s){return `<span class="badge ${statusClass(s)}">${s}</span>`}
function heatClass(v){return v>=90?"hi":v>=80?"mid":"lo"}
function filteredDelivery(){return DELIVERY.filter(d=>(state.program==="All"||d.program===state.program)&&(state.status==="All"||d.status===state.status))}
function normalizeSelection(){
  if(state.dashboard!=="delivery")return;
  const list=filteredDelivery();
  if(list.length && !list.some(d=>d.id===state.selected)) state.selected=list[0].id;
}
function scaleFactor(){return state.period==="qtd"?1.35:state.period==="ytd"?3.4:1}
function regionFactor(){return state.region==="REG"?0.22:state.region==="ALL"?1:1}
function selectedModes(){return state.mode==="All"?Object.keys(MODES):[state.mode]}
function modeAgg(){
  const keys=selectedModes();
  const journeys=keys.reduce((s,k)=>s+MODES[k].journeys,0)*scaleFactor()*regionFactor();
  const prior=keys.reduce((s,k)=>s+MODES[k].prior,0)*scaleFactor()*regionFactor();
  const forecast=keys.reduce((s,k)=>s+MODES[k].forecast,0)*scaleFactor()*regionFactor();
  const base=keys.reduce((s,k)=>s+MODES[k].journeys,0)||1;
  const wt=key=>keys.reduce((s,k)=>s+MODES[k][key]*MODES[k].journeys,0)/base;
  return {journeys,prior,forecast,otr:wt("otr"),otrTarget:wt("otrTarget"),completion:wt("completion"),csat:wt("csat"),complaints:wt("complaints"),util:wt("util"),pml:keys.reduce((s,k)=>s+MODES[k].pml,0)*scaleFactor()*regionFactor()};
}
function quarterLabel(x){const y=Math.floor(x),f=x-y,q=f<.25?"Q1":f<.5?"Q2":f<.75?"Q3":"Q4";return `${q} ${y}`}
function smoothPath(points){
  if(points.length<2)return"";
  let d=`M ${points[0][0]} ${points[0][1]}`;
  for(let i=0;i<points.length-1;i++){
    const p0=points[i],p1=points[i+1];
    const mx=(p0[0]+p1[0])/2;
    d+=` C ${mx} ${p0[1]}, ${mx} ${p1[1]}, ${p1[0]} ${p1[1]}`;
  }
  return d;
}
function bindTooltips(){
  const tip=document.getElementById("tooltip");
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("mouseenter",e=>{tip.innerHTML=el.dataset.tip;tip.style.display="block"});
    el.addEventListener("mousemove",e=>{
      const pad=12, gap=14;
      const r=tip.getBoundingClientRect();
      let left=e.clientX+gap, top=e.clientY+gap;
      if(left+r.width+pad>window.innerWidth) left=e.clientX-r.width-gap;
      if(top+r.height+pad>window.innerHeight) top=e.clientY-r.height-gap;
      tip.style.left=Math.max(pad,left)+"px";
      tip.style.top=Math.max(pad,top)+"px";
    });
    el.addEventListener("mouseleave",()=>tip.style.display="none");
  });
}

function lineComboChart(data,{highlightStart=5,highlightEnd=6}={}){
  const w=650,h=230,pL=38,pR=34,pT=18,pB=28;
  const maxJ=Math.max(...data.map(d=>d.journeys))*1.08;
  const minO=55,maxO=82;
  const slot=(w-pL-pR)/data.length;
  const bars=data.map((d,i)=>{
    const x=pL+i*slot+slot*.18;
    const bh=(d.journeys/maxJ)*(h-pT-pB);
    const y=h-pB-bh;
    return `<rect class="hoverable" data-tip="<strong>${d.p}</strong>Active users ${d.journeys.toFixed(1)}k<br>Adoption ${d.otr.toFixed(1)}%<br>Review tickets ${d.complaints.toFixed(1)} / 100" x="${x}" y="${y}" width="${slot*.44}" height="${bh}" rx="4" fill="var(--blue)" opacity=".68"/>`;
  }).join("");
  const pts=data.map((d,i)=>{
    const x=pL+i*slot+slot*.4;
    const y=pT+(maxO-d.otr)/(maxO-minO)*(h-pT-pB);
    return [x,y];
  });
  const path=smoothPath(pts);
  const bandX=pL+highlightStart*slot;
  const bandW=(highlightEnd-highlightStart+1)*slot;
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${w} ${h}">
    <rect class="band-risk hoverable" data-tip="<strong>Review bottleneck window</strong>Named reviewers were pulled back to BAU. Adoption flattened and tickets rose." x="${bandX}" y="${pT}" width="${bandW}" height="${h-pT-pB}" rx="6"/>
    ${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join("")}
    ${bars}
    <path d="${path}" class="line-a"/>
    ${pts.map((p,i)=>`<circle class="hoverable" data-tip="<strong>${data[i].p}</strong>Adoption ${data[i].otr.toFixed(1)}%<br>Users ${data[i].journeys.toFixed(1)}k" cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text class="tick" x="${pL}" y="${h-8}">P1</text><text class="tick" x="${pL+5*slot}" y="${h-8}">P6</text><text class="tick" x="${pL+11*slot}" y="${h-8}">P12</text>
  </svg></div>`;
}

function scenarioMultiChart(dict,selected){

  const all=Object.values(dict).flatMap(s=>s.series),min=Math.min(...all)-2,max=Math.max(...all)+2;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join("")}${Object.entries(dict).map(([k,s],i)=>{

    <div class="card">
      <div class="chart-title"><div><h3>Stakeholder indicators</h3><p>Selected unit aggregate.</p></div></div>
      <div class="metric-stack"><div class="metric-bar"><label>CSAT</label><div class="track"><div class="fill" style="width:${a.csat}%"></div></div><span class="metric-score">${a.csat.toFixed(0)}</span></div><div class="metric-bar"><label>Review tickets / 100</label><div class="track"><div class="fill" style="width:${Math.min(100,a.complaints*3)}%"></div></div><span class="metric-score">${a.complaints.toFixed(1)}</span></div><div class="metric-bar"><label>Utilisation of intended group</label><div class="track"><div class="fill" style="width:${a.util}%"></div></div><span class="metric-score">${a.util.toFixed(0)}%</span></div></div>
      <div class="decision" style="margin-top:14px"><div class="eyebrow">Linked solution</div><h3>A01 · complaint summarisation</h3><button class="crosslink" data-delivery-link="A01">Open A01</button></div>
    </div>
  </section>`;
}

function renderNetworkPerformance(){
  const a=modeAgg();
  return `
  <div class="page-head"><div><h2 class="page-title">Unit performance</h2><p class="page-desc">Selected unit.</p></div><span class="demo">${state.mode}</span></div>
  <section class="grid two" style="margin-bottom:10px">
    <div class="card feature"><div class="chart-title"><div><h3>Adoption and demand</h3><p>Users as bars, adoption as the line.</p></div></div>${lineComboChart(NETWORK_SERIES,{highlightStart:2,highlightEnd:3})}</div>
    <div class="card"><div class="chart-title"><div><h3>Current unit metrics</h3><p>Weighted selected-unit values.</p></div></div>
      <div class="metric-stack"><div class="metric-bar"><label>Adoption</label><div class="track"><div class="fill" style="width:${a.otr}%"></div></div><span class="metric-score">${a.otr.toFixed(1)}%</span></div><div class="metric-bar"><label>Completion</label><div class="track"><div class="fill" style="width:${a.completion}%"></div></div><span class="metric-score">${a.completion.toFixed(1)}%</span></div><div class="metric-bar"><label>Utilisation</label><div class="track"><div class="fill" style="width:${a.util}%"></div></div><span class="metric-score">${a.util.toFixed(0)}%</span></div></div>
    </div>
  </section>`;
}

function renderNetworkCustomer(){
  const a=modeAgg();
  return `
  <div class="page-head"><div><h2 class="page-title">Stakeholder impact</h2><p class="page-desc">Work mix before and after assist.</p></div><span class="demo">${state.mode}</span></div>
  <section class="grid kpis">
    <div class="card"><div class="eyebrow">CSAT</div><div class="kpi-value">${a.csat.toFixed(0)} / 100</div><div class="kpi-sub">Selected unit</div></div>
    <div class="card"><div class="eyebrow">Review tickets / 100</div><div class="kpi-value">${a.complaints.toFixed(1)}</div><div class="kpi-sub">Human correction load</div></div>
    <div class="card"><div class="eyebrow">Demand vs forecast</div><div class="kpi-value">${(a.journeys-a.forecast>=0?"+":"")+(a.journeys-a.forecast).toFixed(2)}k</div><div class="kpi-sub">Active users</div></div>
    <div class="card"><div class="eyebrow">Illustrative elasticity</div><div class="kpi-value">−0.18</div><div class="kpi-sub">Synthetic example only</div></div>
  </section>
  <section class="grid two" style="margin-bottom:10px">
    <div class="card feature"><div class="chart-title"><div><h3>Work mix before and after assist</h3><p>Blue is before. Gold is after.</p></div></div>${customerComparisonChart()}</div>
    <div class="card"><div class="chart-title"><div><h3>Confounders</h3><p>Hover a tag.</p></div></div>
      <div class="program-heat">
        <span class="program-chip hoverable" data-tip="<strong>Release week</strong>Pack change can lift tickets before quality." style="border-color:var(--warn)"><strong>Release</strong><span>week</span></span>
        <span class="program-chip hoverable" data-tip="<strong>Peak BAU</strong>Reviewers pulled to queues." style="border-color:var(--warn)"><strong>Peak</strong><span>BAU</span></span>
        <span class="program-chip hoverable" data-tip="<strong>Control tightening</strong>New review rule raises tickets by design." style="border-color:var(--risk)"><strong>Control</strong><span>rule</span></span>
      </div>
      <button class="crosslink" data-delivery-link="A03">Open A03</button>
    </div>
  </section>`;
}

function renderNetworkAssurance(){
  const L=NETWORK_LINEAGE[state.networkMetric];
  return `
  <div class="page-head"><div><h2 class="page-title">Value-measure lineage</h2><p class="page-desc">Measure to source.</p></div><span class="demo">${state.networkMetric}</span></div>
  <div class="tabs">${Object.keys(NETWORK_LINEAGE).map(k=>`<button class="tab ${k===state.networkMetric?"active":""}" data-network-metric="${k}">${k}</button>`).join("")}</div>
  <section class="card feature" style="margin-bottom:10px">
    <div class="flow"><div class="node active"><div class="nt">Report measure</div><div class="nb">${L.measure}</div></div><div class="flow-arrow">›</div><div class="node"><div class="nt">Validation</div><div class="nb">${L.validation}</div></div><div class="flow-arrow">›</div><div class="node"><div class="nt">Human review</div><div class="nb">${L.how}</div></div><div class="flow-arrow">›</div><div class="node"><div class="nt">Source</div><div class="nb">${L.source}</div></div></div>
  </section>
  <section class="grid three"><div class="card"><div class="eyebrow">Owner</div><div class="note">${L.owner}</div></div><div class="card"><div class="eyebrow">Refresh</div><div class="note">${L.refresh}</div></div><div class="card"><div class="eyebrow">Evidence</div><div class="note">${L.recon}</div></div></section>
  <button class="crosslink" data-delivery-link="${L.relatedInitiative}">Open related solution · ${L.relatedInitiative}</button>`;
}

function renderNetworkForecast(){
  const s=NETWORK_SCENARIOS[state.networkScenario],a=modeAgg(),j=a.journeys*s.journeyFactor,pml=a.pml*s.pmlFactor;
  return `
  <div class="page-head"><div><h2 class="page-title">Value scenarios</h2><p class="page-desc">Visible assumptions only.</p></div><span class="demo">Scenario modelling</span></div>
  <div class="scenarios">${Object.entries(NETWORK_SCENARIOS).map(([k,v])=>`<button class="scenario ${k===state.networkScenario?"active":""}" data-network-scenario="${k}"><strong>${v.name}</strong><span>${v.note}</span></button>`).join("")}</div>
  <section class="grid kpis">
    <div class="card"><div class="eyebrow">Forecast users</div><div class="kpi-value">${j.toFixed(2)}k</div><div class="kpi-sub">${s.name}</div></div>
    <div class="card"><div class="eyebrow">Escalation hours</div><div class="kpi-value">${pml.toFixed(2)}k</div><div class="kpi-sub">Scenario-adjusted</div></div>
    <div class="card"><div class="eyebrow">Adoption reference</div><div class="kpi-value">${a.otr.toFixed(1)}%</div><div class="kpi-sub">Current baseline</div></div>
    <div class="card"><div class="eyebrow">Completion</div><div class="kpi-value">${a.completion.toFixed(1)}%</div><div class="kpi-sub">Current reference</div></div>
  </section>
  <section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Scenario trajectories</h3><p>Smooth scenario lines.</p></div></div>${scenarioMultiChart(NETWORK_SCENARIOS,state.networkScenario)}</div><div class="decision"><div class="eyebrow">Scenario rule</div><h3>${s.name}</h3><p>${s.note} No causal prediction or machine-learning output is implied.</p></div></section>`;
}

function renderControls(){
  const c=document.getElementById("controls");
  if(state.dashboard==="delivery"){
    c.innerHTML=`<select class="select" id="programFilter"><option value="All">All units</option><option>Enablement</option><option>Contact Centre</option><option>Operations</option><option>Compliance</option><option>Financial Crime Risk</option><option>Retail Banking</option><option>Business Banking</option></select><select class="select" id="statusFilter"><option value="All">All statuses</option><option>Adopted</option><option>At Risk</option><option>Paused</option></select><button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText"></span></button>`;
    document.getElementById("programFilter").value=state.program;document.getElementById("statusFilter").value=state.status;
    document.getElementById("programFilter").onchange=e=>{state.program=e.target.value;normalizeSelection();render()};
    document.getElementById("statusFilter").onchange=e=>{state.status=e.target.value;normalizeSelection();render()};
  }else{
    c.innerHTML=`<select class="select" id="periodFilter"><option value="4w">Current 4 weeks</option><option value="qtd">Quarter to date</option><option value="ytd">Year to date</option></select><select class="select" id="modeFilter"><option value="All">All units</option><option>Retail Banking</option><option>Business Banking</option><option>Operations</option><option>Compliance</option><option>Contact Centre</option><option>Financial Crime Risk</option></select><select class="select" id="regionFilter"><option value="GS">AU franchise</option><option value="REG">International books</option><option value="ALL">Group-wide</option></select><button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText"></span></button>`;
    document.getElementById("periodFilter").value=state.period;document.getElementById("modeFilter").value=state.mode;document.getElementById("regionFilter").value=state.region;
    document.getElementById("periodFilter").onchange=e=>{state.period=e.target.value;render()};
    document.getElementById("modeFilter").onchange=e=>{state.mode=e.target.value;render()};
    document.getElementById("regionFilter").onchange=e=>{state.region=e.target.value;render()};
  }
  bindTheme();
}
function renderSidebar(){
  const side=document.getElementById("sidebar");
  if(state.dashboard==="delivery"){
    const items=[["overview","Portfolio overview"],["assurance","Governance & assurance"],["detail","Solution detail"],["forecast","Adoption scenarios"]];
    side.innerHTML=`<div class="side-title">Discovery &amp; delivery</div>${items.map((x,i)=>`<button class="nav ${state.deliveryView===x[0]?"active":""}" data-delivery-view="${x[0]}"><span class="nav-num">0${i+1}</span><span class="nav-label">${x[1]}</span></button>`).join("")}<div class="side-meta">Unit: ${state.program}<br>Status: ${state.status}<br>Selected: ${state.selected}<br><br>Synthetic demonstration.</div>`;
    side.querySelectorAll("[data-delivery-view]").forEach(b=>b.onclick=()=>{state.deliveryView=b.dataset.deliveryView;render()});
  }else{
    const items=[["command","Value command"],["performance","Unit performance"],["customer","Stakeholder impact"],["assurance","Measure lineage"],["forecast","Value scenarios"]];
    side.innerHTML=`<div class="side-title">Value &amp; impact</div>${items.map((x,i)=>`<button class="nav ${state.networkView===x[0]?"active":""}" data-network-view="${x[0]}"><span class="nav-num">0${i+1}</span><span class="nav-label">${x[1]}</span></button>`).join("")}<div class="side-meta">Period: ${state.period}<br>Unit: ${state.mode}<br>Book: ${state.region}<br><br>Synthetic demonstration.</div>`;
    side.querySelectorAll("[data-network-view]").forEach(b=>b.onclick=()=>{state.networkView=b.dataset.networkView;render()});
  }
}
function renderMain(){
  normalizeSelection();
  const m=document.getElementById("main");
  if(state.dashboard==="delivery"){
    m.innerHTML=state.deliveryView==="overview"?renderDeliveryOverview():state.deliveryView==="detail"?renderDeliveryDetail():state.deliveryView==="assurance"?renderDeliveryAssurance():renderDeliveryForecast();
  }else{
    m.innerHTML=state.networkView==="command"?renderNetworkCommand():state.networkView==="performance"?renderNetworkPerformance():state.networkView==="customer"?renderNetworkCustomer():state.networkView==="assurance"?renderNetworkAssurance():renderNetworkForecast();
  }
  bindDynamic();attachMetricHelp();bindTooltips();
}
function bindDynamic(){
  document.querySelectorAll("[data-delivery-view-jump]").forEach(b=>b.onclick=()=>{state.deliveryView=b.dataset.deliveryViewJump;render()});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.open;state.deliveryView="detail";render()});
  document.querySelectorAll("[data-select]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.select;render()});
  document.querySelectorAll("[data-delivery-metric]").forEach(b=>b.onclick=()=>{state.deliveryMetric=b.dataset.deliveryMetric;state.deliveryView="assurance";render()});
  document.querySelectorAll("[data-delivery-scenario]").forEach(b=>b.onclick=()=>{state.deliveryScenario=b.dataset.deliveryScenario;render()});
  document.querySelectorAll("[data-network-metric]").forEach(b=>b.onclick=()=>{state.networkMetric=b.dataset.networkMetric;state.networkView="assurance";render()});
  document.querySelectorAll("[data-network-scenario]").forEach(b=>b.onclick=()=>{state.networkScenario=b.dataset.networkScenario;render()});
  document.querySelectorAll("[data-network-link]").forEach(b=>b.onclick=()=>{
    state.dashboard="network";
    const k=b.dataset.networkLink;
    state.networkMetric = NETWORK_LINEAGE[k] ? k : "Advisor adoption";
    state.networkView="assurance";render();
  });
  document.querySelectorAll("[data-delivery-link]").forEach(b=>b.onclick=()=>{state.dashboard="delivery";state.selected=b.dataset.deliveryLink;state.deliveryView="detail";render()});
}
function bindTheme(){
  const btn=document.getElementById("themeBtn"),txt=document.getElementById("themeText");
  const dark=document.documentElement.getAttribute("data-theme")==="dark";txt.textContent=dark?"Light mode":"Dark mode";
  btn.onclick=()=>{const isDark=document.documentElement.getAttribute("data-theme")==="dark";document.documentElement.setAttribute("data-theme",isDark?"light":"dark");localStorage.setItem("aiPortfolioTheme",isDark?"light":"dark");renderControls();};
}
function render(){
  document.getElementById("switchDelivery").classList.toggle("active",state.dashboard==="delivery");
  document.getElementById("switchNetwork").classList.toggle("active",state.dashboard==="network");
  renderControls();renderSidebar();renderMain();
}
document.getElementById("switchDelivery").onclick=()=>{state.dashboard="delivery";render()};
document.getElementById("switchNetwork").onclick=()=>{state.dashboard="network";render()};
document.documentElement.setAttribute("data-theme",localStorage.getItem("aiPortfolioTheme")||"light");
if(!localStorage.getItem("aiPortfolioGuided")){
  const sw=document.getElementById("modeSwitch");
  sw.classList.add("guide-pulse");
  setTimeout(()=>sw.classList.remove("guide-pulse"),2300);
  const clearGuide=()=>{localStorage.setItem("aiPortfolioGuided","1");sw.classList.remove("guide-pulse")};
  sw.addEventListener("click",clearGuide,{once:true});
}
render();
</script>
</body>
</html>
