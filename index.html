<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Delivery & Risk Portfolio — Khaled Sanad</title>

<meta
  name="description"
  content="AI delivery, business analysis, governance and adoption portfolio."
>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<style>
:root{
  --page:#eef2f5;
  --surface:#ffffff;
  --surface2:#f7f9fb;
  --surface3:#e8edf2;
  --line:#d8e0e7;
  --line2:#bcc8d3;
  --text:#17232d;
  --text2:#51606c;
  --text3:#7d8993;

  --navy:#173a53;
  --navySoft:#e4edf4;
  --cyan:#188da0;
  --cyanSoft:#e1f2f4;
  --blue:#547fa2;
  --blueSoft:#e8f0f6;
  --violet:#7665a8;
  --violetSoft:#eeeaf7;
  --amber:#bf892d;
  --amberSoft:#fbf0db;
  --green:#4b8458;
  --greenSoft:#e8f2e9;
  --red:#a83d35;
  --redSoft:#f7e6e4;

  --shadow:0 6px 22px rgba(25,42,56,.07);
  --shadowLg:0 16px 38px rgba(25,42,56,.11);

  --radius:14px;
  --mono:"DM Mono",ui-monospace,monospace;
  --sans:Inter,system-ui,sans-serif;
  --display:Manrope,Inter,sans-serif;
}

html[data-theme="dark"]{
  --page:#0e1419;
  --surface:#161f26;
  --surface2:#1c2730;
  --surface3:#26333d;
  --line:#2b3a45;
  --line2:#41515d;
  --text:#edf2f5;
  --text2:#abb7c0;
  --text3:#7f8f9a;

  --navy:#76a6c7;
  --navySoft:#1a3040;
  --cyan:#62c3ca;
  --cyanSoft:#173538;
  --blue:#7da9c9;
  --blueSoft:#1d3040;
  --violet:#ae9add;
  --violetSoft:#2b2540;
  --amber:#ddb264;
  --amberSoft:#3a2d18;
  --green:#84ca91;
  --greenSoft:#1d3825;
  --red:#e18075;
  --redSoft:#3d221f;

  --shadow:0 8px 25px rgba(0,0,0,.26);
  --shadowLg:0 16px 42px rgba(0,0,0,.34);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--page);
  color:var(--text);
  font-family:var(--sans);
}

body{
  font-size:13px;
  line-height:1.45;
}

button,select{font:inherit}
button{cursor:pointer}
svg{display:block;width:100%;height:auto}

button:focus-visible,
select:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

.shell{min-height:100vh}

/* HEADER */

.topbar{
  position:sticky;
  top:0;
  z-index:100;

  display:grid;
  grid-template-columns:minmax(290px,1fr) auto auto;
  gap:16px;
  align-items:center;

  padding:12px 20px;

  background:color-mix(in srgb,var(--surface) 94%,transparent);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.logo{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:11px;
  position:relative;
  background:linear-gradient(145deg,var(--navy),var(--cyan));
  box-shadow:var(--shadow);
}

.logo:before{
  content:"";
  position:absolute;
  left:9px;
  right:9px;
  top:11px;
  height:2px;
  border-radius:3px;
  background:#fff;
  box-shadow:0 7px 0 #fff,0 14px 0 #fff;
}

.brand h1{
  margin:0;
  font:700 1rem/1.05 var(--display);
  letter-spacing:-.02em;
}

.brand p{
  margin:4px 0 0;
  font:400 .48rem/1.2 var(--mono);
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--text3);
}

.primary-nav{
  display:flex;
  align-items:center;
  gap:3px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface2);
}

.primary-nav button{
  border:0;
  background:transparent;
  color:var(--text2);
  padding:7px 11px;
  border-radius:7px;
  font-size:.62rem;
  font-weight:700;
}

.primary-nav button.active{
  background:var(--surface);
  color:var(--navy);
  box-shadow:var(--shadow);
}

.header-controls{
  display:flex;
  align-items:center;
  gap:7px;
}

.select,
.theme-btn{
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:8px;
  padding:7px 9px;
  font-size:.6rem;
}

.theme-btn{
  min-width:38px;
  font-weight:700;
}

.live-chip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface2);
  color:var(--text2);
  font:500 .5rem/1 var(--mono);
  text-transform:uppercase;
  letter-spacing:.06em;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 0 0 rgba(24,141,160,.45);
  animation:livePulse 1.9s infinite;
}

/* PAGE */

.page{
  max-width:1580px;
  margin:0 auto;
  padding:20px 22px 58px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  margin-bottom:13px;
}

.kicker{
  margin-bottom:5px;
  color:var(--cyan);
  font:500 .49rem/1.2 var(--mono);
  text-transform:uppercase;
  letter-spacing:.1em;
}

.hero h2{
  margin:0;
  font:700 1.35rem/1.08 var(--display);
  letter-spacing:-.035em;
}

.demo-tag{
  flex:0 0 auto;
  padding:6px 9px;
  border-radius:999px;
  background:var(--navySoft);
  color:var(--navy);
  border:1px solid color-mix(in srgb,var(--navy) 25%,var(--line));
  font:500 .48rem/1 var(--mono);
  text-transform:uppercase;
  letter-spacing:.07em;
  white-space:nowrap;
}

/* GRIDS */

.kpi-strip{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:10px;
}

.bento{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:10px;
}

.span12{grid-column:span 12}
.span8{grid-column:span 8}
.span7{grid-column:span 7}
.span6{grid-column:span 6}
.span5{grid-column:span 5}
.span4{grid-column:span 4}

/* CARDS */

.card{
  min-width:0;
  padding:14px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);

  opacity:0;
  transform:translateY(8px);
  animation:cardIn .45s cubic-bezier(.2,.7,.2,1) forwards;
}

.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.16s}
.card:nth-child(6){animation-delay:.20s}

.card.feature{
  box-shadow:var(--shadowLg);
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:10px;
}

.section-head h3{
  margin:0;
  font:700 .76rem/1.2 var(--display);
}

.section-head p{
  margin:3px 0 0;
  color:var(--text3);
  font-size:.54rem;
}

.eyebrow{
  margin-bottom:6px;
  color:var(--text3);
  font:500 .47rem/1.2 var(--mono);
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* KPI */

.kpi{min-height:92px}

.kpi-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.kpi-value{
  margin:5px 0 3px;
  font:700 1.5rem/.95 var(--display);
  letter-spacing:-.04em;
}

.kpi-sub{
  color:var(--text2);
  font-size:.55rem;
  line-height:1.4;
}

.kpi-symbol{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--cyanSoft);
  color:var(--cyan);
  font:500 .5rem/1 var(--mono);
}

/* BADGES */

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 7px;
  border-radius:999px;
  font-size:.52rem;
  font-weight:700;
}

.badge:before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:currentColor;
}

.good{color:var(--green);background:var(--greenSoft)}
.warn{color:var(--amber);background:var(--amberSoft)}
.bad{color:var(--red);background:var(--redSoft)}
.info{color:var(--blue);background:var(--blueSoft)}

/* CHARTS */

.chart{
  width:100%;
  height:245px;
}

.chart.tall{
  height:310px;
}

.gridline{
  stroke:var(--line);
  stroke-width:1;
  stroke-dasharray:3 5;
}

.axis-label{
  fill:var(--text3);
  font:8px var(--mono);
}

.chart-line{
  fill:none;
  stroke:var(--cyan);
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1200;
  stroke-dashoffset:1200;
  animation:drawLine 1.2s ease-out .12s forwards;
}

.chart-line-amber{
  fill:none;
  stroke:var(--amber);
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1200;
  stroke-dashoffset:1200;
  animation:drawLine 1.4s ease-out .2s forwards;
}

.chart-bar{
  transform-box:fill-box;
  transform-origin:center bottom;
  transform:scaleY(0);
  animation:growBar .7s cubic-bezier(.2,.8,.2,1) forwards;
}

.chart-bubble{
  transform-box:fill-box;
  transform-origin:center;
  transform:scale(0);
  animation:bubbleIn .52s cubic-bezier(.2,.9,.2,1.15) forwards;
}

/* TOOLTIP */

.tooltip{
  position:fixed;
  z-index:500;
  display:none;
  pointer-events:none;
  max-width:280px;
  padding:8px 10px;
  color:var(--surface);
  background:var(--text);
  border-radius:8px;
  font-size:.57rem;
  line-height:1.45;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}

.tooltip strong{
  display:block;
  margin-bottom:3px;
}

.hoverable{cursor:help}

/* SCATTER + INSIGHTS */

.scatter-composite{
  display:grid;
  gap:12px;
}

.portfolio-scatter{
  height:205px;
}

.portfolio-read{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  padding-top:11px;
  border-top:1px solid var(--line);
}

.portfolio-insight{
  min-height:82px;
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface2);

  opacity:0;
  transform:translateY(5px);
  animation:insightIn .42s ease-out forwards;
}

.portfolio-insight:nth-child(2){animation-delay:.08s}
.portfolio-insight:nth-child(3){animation-delay:.16s}

.portfolio-insight.attention{
  background:linear-gradient(145deg,var(--amberSoft),var(--surface));
  border-color:color-mix(in srgb,var(--amber) 35%,var(--line));
}

.insight-label{
  margin-bottom:5px;
  color:var(--text3);
  font:500 .45rem/1.2 var(--mono);
  text-transform:uppercase;
  letter-spacing:.07em;
}

.portfolio-insight strong{
  display:block;
  margin-bottom:4px;
  font-size:.57rem;
  line-height:1.3;
}

.portfolio-insight span{
  display:block;
  color:var(--text2);
  font-size:.49rem;
  line-height:1.4;
}

/* DONUT */

.donut-layout{
  display:grid;
  grid-template-columns:155px 1fr;
  align-items:center;
  gap:14px;
}

.donut-wrap{
  position:relative;
  width:150px;
  height:150px;
}

.donut-svg{
  width:150px;
  height:150px;
  transform:rotate(-90deg);
}

.donut-track{
  fill:none;
  stroke:var(--surface3);
  stroke-width:18;
}

.donut-seg{
  fill:none;
  stroke-width:18;
  stroke-linecap:butt;
  animation:donutIn .9s ease-out forwards;
}

.donut-center{
  position:absolute;
  inset:0;
  display:grid;
  place-content:center;
  text-align:center;
  pointer-events:none;
}

.donut-center strong{
  font:700 1.3rem/1 var(--display);
}

.donut-center span{
  margin-top:2px;
  color:var(--text3);
  font:400 .46rem/1.2 var(--mono);
}

.legend-list{
  display:grid;
  gap:8px;
}

.legend-row{
  display:grid;
  grid-template-columns:8px 1fr auto;
  gap:7px;
  align-items:center;
  font-size:.57rem;
}

.legend-dot{
  width:7px;
  height:7px;
  border-radius:2px;
}

.legend-row strong{
  font:500 .54rem/1 var(--mono);
}

/* LIFECYCLE */

.lifecycle{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.life-stage{
  min-height:104px;
  position:relative;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface2);
}

.life-stage.active{
  border-color:var(--cyan);
  background:linear-gradient(145deg,var(--cyanSoft),var(--surface));
}

.life-num{
  color:var(--text3);
  font:500 .45rem/1 var(--mono);
}

.life-stage strong{
  display:block;
  margin-top:5px;
  font-size:.62rem;
}

.life-stage p{
  margin:5px 0 0;
  color:var(--text2);
  font-size:.51rem;
}

.life-count{
  position:absolute;
  right:9px;
  top:9px;
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:var(--surface);
  border:1px solid var(--line);
  font:700 .8rem/1 var(--display);
}

/* RISK MATRIX */

.risk-matrix{
  display:grid;
  grid-template-columns:85px repeat(4,1fr);
  gap:5px;
}

.rm-head{
  display:grid;
  place-items:center;
  color:var(--text3);
  font:500 .44rem/1 var(--mono);
  text-transform:uppercase;
  letter-spacing:.05em;
}

.rm-label{
  display:flex;
  align-items:center;
  color:var(--text2);
  font-size:.53rem;
}

.rm-cell{
  min-height:48px;
  display:grid;
  place-items:center;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface2);
}

.rm-cell.low{
  background:color-mix(in srgb,var(--greenSoft) 70%,var(--surface));
}

.rm-cell.med{
  background:color-mix(in srgb,var(--amberSoft) 75%,var(--surface));
}

.rm-cell.high{
  background:color-mix(in srgb,var(--redSoft) 80%,var(--surface));
}

.rm-count{
  font:700 .82rem/1 var(--display);
}

/* QUEUE */

.queue{
  display:grid;
  gap:6px;
}

.queue-row{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto 64px;
  gap:8px;
  align-items:center;
  padding:8px 9px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--surface2);
  cursor:pointer;
}

.queue-row:hover{
  border-color:var(--cyan);
}

.queue-id{
  color:var(--text3);
  font:500 .48rem/1 var(--mono);
}

.queue-title{
  min-width:0;
}

.queue-title strong{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:.57rem;
}

.queue-title span{
  display:block;
  margin-top:2px;
  color:var(--text3);
  font-size:.48rem;
}

.queue-score{
  color:var(--text2);
  font:500 .5rem/1 var(--mono);
}

.attention-dot{
  width:7px;
  height:7px;
  display:inline-block;
  margin-right:5px;
  border-radius:50%;
  background:var(--amber);
  animation:attentionBlink 1.65s infinite;
}

.attention-dot.red{
  background:var(--red);
}

/* SOLUTION STUDIO */

.solution-hero{
  width:100%;
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:center;
}

.solution-title h2{
  max-width:850px;
  margin:4px 0 6px;
  font:700 1.45rem/1.08 var(--display);
  letter-spacing:-.035em;
}

.solution-title p{
  margin:0;
  color:var(--text2);
  font-size:.64rem;
}

.hero-score{
  min-width:125px;
  text-align:center;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface2);
}

.hero-score strong{
  display:block;
  font:700 2rem/1 var(--display);
}

.hero-score span{
  color:var(--text3);
  font:400 .45rem/1.2 var(--mono);
  text-transform:uppercase;
  letter-spacing:.06em;
}

.solution-tabs{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin:11px 0;
}

.solution-tab{
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--surface2);
  color:var(--text2);
  font:500 .47rem/1 var(--mono);
}

.solution-tab.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

/* REQUIREMENTS */

.requirement-grid{
  display:grid;
  gap:7px;
}

.requirement{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:10px;
  padding:9px 10px;
  border-radius:9px;
  background:var(--surface2);
  border:1px solid var(--line);
}

.requirement label{
  color:var(--text3);
  font:500 .45rem/1.3 var(--mono);
  text-transform:uppercase;
  letter-spacing:.05em;
}

.requirement div{
  color:var(--text2);
  font-size:.56rem;
}

/* GATES */

.gates{
  display:grid;
  gap:7px;
}

.gate{
  display:grid;
  grid-template-columns:27px 1fr auto;
  gap:8px;
  align-items:center;
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface2);
}

.gate-icon{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:8px;
  font:500 .45rem/1 var(--mono);
}

.gate-icon.good{
  background:var(--greenSoft);
  color:var(--green);
}

.gate-icon.warn{
  background:var(--amberSoft);
  color:var(--amber);
}

.gate-icon.bad{
  background:var(--redSoft);
  color:var(--red);
}

.gate strong{
  display:block;
  font-size:.56rem;
}

.gate span{
  display:block;
  margin-top:2px;
  color:var(--text3);
  font-size:.48rem;
}

/* LINEAGE */

.lineage{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.lineage-node{
  min-height:105px;
  position:relative;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface2);
}

.lineage-node:not(:last-child):after{
  content:"→";
  position:absolute;
  right:-14px;
  top:42px;
  z-index:2;
  width:20px;
  text-align:center;
  color:var(--text3);
}

.lineage-node strong{
  display:block;
  margin:4px 0;
  font-size:.58rem;
}

.lineage-node p{
  margin:0;
  color:var(--text2);
  font-size:.5rem;
}

/* METRICS */

.metric-list{
  display:grid;
  gap:9px;
}

.metric{
  display:grid;
  grid-template-columns:125px 1fr 48px;
  gap:8px;
  align-items:center;
}

.metric label{
  color:var(--text2);
  font-size:.53rem;
}

.track{
  height:7px;
  position:relative;
  overflow:hidden;
  border-radius:999px;
  background:var(--surface3);
}

.fill{
  height:100%;
  border-radius:999px;
  transform-origin:left center;
  transform:scaleX(0);
  animation:growFill .8s ease-out forwards;
}

.metric strong{
  text-align:right;
  font:500 .5rem/1 var(--mono);
}

/* SCENARIOS */

.scenario-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.scenario{
  text-align:left;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface2);

@keyframes cardIn{

}

@keyframes insightIn{

/* =========================================================

========================================================= */

function esc(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


function filtered(){
  return SOLUTIONS.filter(item =>
    (state.unit === "All" || item.unit === state.unit) &&
    (state.status === "All" || item.status === state.status)
  );
}


function selected(){
  return SOLUTIONS.find(item => item.id === state.selected) || SOLUTIONS[0];
}


function normalize(){
  const list = filtered();

  if(list.length && !list.some(item => item.id === state.selected)){
    state.selected = list[0].id;
  }
}


function statusClass(value){
  if(["Adopted","Pass","Low"].includes(value)) return "good";
  if(["At Risk","Conditional","Medium"].includes(value)) return "warn";
  return "bad";
}


function badge(value){
  return `<span class="badge ${statusClass(value)}">${value}</span>`;
}


function kpi(label,value,sub,symbol){
  return `
    <div class="card kpi">
      <div class="kpi-top">
        <div class="eyebrow">${label}</div>
        <span class="kpi-symbol">${symbol}</span>
      </div>

      <div class="kpi-value">${value}</div>
      <div class="kpi-sub">${sub}</div>
    </div>
  `;
}


function smooth(points){
  if(points.length < 2) return "";

  let d = `M ${points[0][0]} ${points[0][1]}`;

  for(let i=0;i<points.length-1;i++){
    const a = points[i];
    const b = points[i+1];
    const m = (a[0] + b[0]) / 2;

    d += ` C ${m} ${a[1]}, ${m} ${b[1]}, ${b[0]} ${b[1]}`;
  }

  return d;
}

/* =========================================================
   DYNAMIC DONUT
========================================================= */

function donut(list){
  const total = Math.max(1,list.length);

  const adopted = list.filter(x => x.status === "Adopted").length;
  const risk = list.filter(x => x.status === "At Risk").length;
  const paused = list.filter(x => x.status === "Paused").length;

  const values = [adopted,risk,paused];
  const colours = ["var(--green)","var(--amber)","var(--red)"];

  let offset = 0;

  const segments = values.map((value,index) => {
    const pct = value / total * 100;

    const circle = `
      <circle
        class="donut-seg"
        cx="75"
        cy="75"
        r="55"
        pathLength="100"
        stroke="${colours[index]}"
        stroke-dasharray="${pct} ${100-pct}"
        stroke-dashoffset="${-offset}"
      ></circle>
    `;

    offset += pct;
    return circle;
  }).join("");

  return `
    <div class="donut-layout">

      <div class="donut-wrap">
        <svg class="donut-svg" viewBox="0 0 150 150">
          <circle
            class="donut-track"
            cx="75"
            cy="75"
            r="55"
          ></circle>

          ${segments}
        </svg>

        <div class="donut-center">
          <strong>${list.length}</strong>
          <span>solutions</span>
        </div>
      </div>

      <div class="legend-list">
        ${legendRow("var(--green)","Adopted",adopted)}
        ${legendRow("var(--amber)","At Risk",risk)}
        ${legendRow("var(--red)","Paused",paused)}
      </div>

    </div>
  `;
}


function legendRow(colour,label,value){
  return `
    <div class="legend-row">
      <i
        class="legend-dot"
        style="background:${colour}"
      ></i>

      <span>${label}</span>
      <strong>${value}</strong>
    </div>
  `;
}


/* =========================================================
   SCATTER + PORTFOLIO READ
========================================================= */

function scatter(list){
  const width = 780;
  const height = 205;

  const left = 48;
  const right = 25;
  const top = 22;
  const bottom = 30;

  const x = value =>
    left +
    value / 100 *
    (width-left-right);

  const y = value =>
    top +
    (100-value) / 100 *
    (height-top-bottom);


  const highestValue = [...list]
    .sort((a,b) => b.value-a.value)[0];


  const strongestReady = [...list]
    .filter(item => item.readiness >= 80)
    .sort((a,b) => b.value-a.value)[0];


  const biggestConstraint = [...list]
    .sort((a,b) => {
      const score = item =>
        (item.value-item.readiness) +
        Math.max(0,item.ttv) +
        (item.status === "Paused" ? 20 : 0) +
        (item.status === "At Risk" ? 10 : 0);

      return score(b)-score(a);
    })[0];


  const highValueLowReadiness = list.filter(item =>
    item.value >= 80 &&
    item.readiness < 65
  ).length;


  const insightOne = highestValue ? `
    <div class="portfolio-insight">
      <div class="insight-label">
        Highest expected value

      <strong>
        ${highestValue.id} · ${esc(highestValue.name)}

        readiness ${highestValue.readiness}/100
      </span>
    </div>

  const insightTwo = strongestReady ? `

      <div class="insight-label">
        Best positioned to progress

        ${strongestReady.id} · ${esc(strongestReady.name)}

        ${strongestReady.status} ·

  const insightThree = biggestConstraint ? `
    <div class="portfolio-insight attention">

      <div class="insight-label">
        <i class="attention-dot"></i>

      <strong>

      <span>
        ${biggestConstraint.status} ·
        ${biggestConstraint.ttv >= 0 ? "+" : ""}

  return `

      <svg

        <rect
          x="${left}"
          y="${top}"
          width="${(width-left-right)/2}"
          height="${(height-top-bottom)/2}"
          fill="var(--cyanSoft)"
          opacity=".5"
        ></rect>

        <rect
          x="${left+(width-left-right)/2}"
          y="${top}"
          width="${(width-left-right)/2}"
          height="${(height-top-bottom)/2}"
          fill="var(--violetSoft)"
          opacity=".5"
        ></rect>


        <line
          class="gridline"
          x1="${left+(width-left-right)/2}"
          y1="${top}"
          x2="${left+(width-left-right)/2}"
          y2="${height-bottom}"
        ></line>


        <line
          class="gridline"
          x1="${left}"
          y1="${top+(height-top-bottom)/2}"
          x2="${width-right}"

        ></line>


        <text
          class="axis-label"

        >

/* =========================================================

function lifecycle(list){
  const stages = [
    ["Discovery","Problem and current state"],
    ["Definition","Requirements and controls"],
    ["Prototype","Build and test"],
    ["Pilot","Users and exceptions"],
    ["Adoption","Operational use and value"]
  ];

  const counts = [
    list.filter(x => x.stage === "Discovery").length,
    list.filter(x => ["Discovery","Prototype"].includes(x.stage)).length,
    list.filter(x => x.stage === "Prototype").length,
    list.filter(x => x.stage === "Pilot").length,
    list.filter(x => x.stage === "Production").length
  ];

  return `
    <div class="lifecycle">

      ${stages.map((stage,index) => `
        <div class="life-stage ${index === 2 ? "active" : ""}">

          <span class="life-num">
            0${index+1}
          </span>

          <span class="life-count">
            ${counts[index]}
          </span>

          <strong>
            ${stage[0]}
          </strong>

          <p>
            ${stage[1]}
          </p>

        </div>
      `).join("")}

    </div>
  `;
}


/* =========================================================
   RISK MATRIX
========================================================= */

function riskMatrix(list){
  const rows = [
    "Data / privacy",
    "Output reliability",
    "Human oversight",
    "Vendor / tooling"
  ];

  const levels = [
    "Low",
    "Medium",
    "High",
    "Review"
  ];

  const mapCategory = item => {
    const value = item.riskCategory.toLowerCase();

    if(
      value.includes("privacy") ||
      value.includes("data access")
    ){
      return "Data / privacy";
    }

    if(
      value.includes("output") ||
      value.includes("model")
    ){
      return "Output reliability";
    }

    if(
      value.includes("human") ||
      value.includes("governance")
    ){
      return "Human oversight";
    }

    return "Vendor / tooling";
  };

  return `
    <div class="risk-matrix">

      <div></div>

      ${levels.map(level => `
        <div class="rm-head">
          ${level}
        </div>
      `).join("")}


      ${rows.map(row => {
        const relevant = list.filter(
          item => mapCategory(item) === row
        );

        return `
          <div class="rm-label">
            ${row}
          </div>

          ${levels.map(level => {
            const count = relevant.filter(item => {
              if(level === "Review"){
                return (
                  item.privacy === "Review" ||
                  item.data === "Review"
                );
              }

              return item.risk === level;
            }).length;

            const cls =
              level === "Low"
                ? "low"
                : level === "Medium"
                ? "med"
                : "high";

            return `
              <div
                class="rm-cell ${cls} hoverable"
                data-tip="
                  <strong>${row}</strong>
                  ${level}: ${count} solutions
                "
              >
                <span class="rm-count">
                  ${count}
                </span>
              </div>
            `;
          }).join("")}
        `;
      }).join("")}

    </div>
  `;
}


/* =========================================================
   ATTENTION QUEUE
========================================================= */

function priorityQueue(list){
  const scored = list
    .map(item => {
      let score =
        item.value -
        item.readiness +
        Math.max(0,item.ttv);

      if(item.status === "At Risk") score += 15;
      if(item.status === "Paused") score += 20;

      return {
        ...item,
        score
      };
    })
    .sort((a,b) => b.score-a.score)
    .slice(0,6);


  return `
    <div class="queue">

      ${scored.map(item => {
        const indicator =
          item.status === "Adopted"
            ? ""
            : `
              <i
                class="attention-dot
                ${item.status === "Paused" ? "red" : ""}"
              ></i>
            `;

        return `
          <div
            class="queue-row"
            data-open="${item.id}"
          >

            <span class="queue-id">
              ${item.id}
            </span>

            <div class="queue-title">

              <strong>
                ${indicator}
                ${esc(item.name)}
              </strong>

              <span>
                ${item.unit} · ${item.stage}
              </span>

            </div>

            ${badge(item.status)}

            <span class="queue-score">
              P${item.score.toFixed(0)}
            </span>

          </div>
        `;
      }).join("")}

    </div>
  `;
}

/* =========================================================
   ADOPTION HISTORY
========================================================= */

function historyChart(series){
  const width = 760;
  const height = 220;

  const left = 24;
  const right = 24;
  const top = 20;
  const bottom = 26;

  const minimum = Math.min(...series)-5;
  const maximum = Math.max(...series)+5;

  const points = series.map((value,index) => [
    left +
    index/(series.length-1) *
    (width-left-right),

    top +
    (maximum-value)/(maximum-minimum) *
    (height-top-bottom)
  ]);

  return `
    <svg
      class="chart"
      viewBox="0 0 ${width} ${height}"
    >

      ${[0,1,2,3].map(index => {
        const y =
          top +
          index *
          (height-top-bottom) /
          3;

        return `
          <line
            class="gridline"
            x1="${left}"
            y1="${y}"
            x2="${width-right}"
            y2="${y}"
          ></line>
        `;
      }).join("")}


      <path
        class="chart-line"
        d="${smooth(points)}"
      ></path>


      ${points.map((point,index) => `
        <circle
          class="hoverable chart-bubble"
          style="animation-delay:${.12+index*.06}s"
          data-tip="
            <strong>Period ${index+1}</strong>
            Adoption index ${series[index]}
          "
          cx="${point[0]}"
          cy="${point[1]}"
          r="4"
          fill="var(--surface)"
          stroke="var(--cyan)"
          stroke-width="2"
        ></circle>
      `).join("")}

    </svg>
  `;
}

/* =========================================================
   VALUE & ADOPTION CHART
========================================================= */

function adoptionCombo(){
  const width = 780;
  const height = 285;

  const left = 38;
  const right = 28;
  const top = 18;
  const bottom = 28;

  const maximumUsers =
    Math.max(
      ...ADOPTION_SERIES.map(
        item => item.users
      )
    ) * 1.1;

  const slot =
    (width-left-right) /
    ADOPTION_SERIES.length;

  const adoptionPoints = [];
  const reviewPoints = [];


  const bars = ADOPTION_SERIES.map(
    (item,index) => {

      const barHeight =
        item.users /
        maximumUsers *
        (height-top-bottom);

      const x =
        left +
        index*slot +
        slot*.17;

      const y =
        height -
        bottom -
        barHeight;

      const centre =
        left +
        index*slot +
        slot*.43;


      adoptionPoints.push([
        centre,
        top +
        (100-item.adoption)/100 *
        (height-top-bottom)
      ]);


      reviewPoints.push([
        centre,
        top +
        (100-item.review)/100 *
        (height-top-bottom)
      ]);


      return `
        <rect
          class="chart-bar hoverable"
          style="animation-delay:${.08+index*.05}s"
          data-tip="
            <strong>${item.p}</strong>
            Users ${item.users}k<br>
            Adoption ${item.adoption}%<br>
            Review load ${item.review}%
          "
          x="${x}"
          y="${y}"
          width="${slot*.48}"
          height="${barHeight}"
          rx="4"
          fill="var(--blue)"
          opacity=".68"
        ></rect>
      `;
    }
  ).join("");


  return `
    <svg
      class="chart"
      viewBox="0 0 ${width} ${height}"
    >

      ${[0,1,2,3].map(index => {
        const y =
          top +
          index *
          (height-top-bottom) /
          3;

        return `
          <line
            class="gridline"
            x1="${left}"
            y1="${y}"
            x2="${width-right}"
            y2="${y}"
          ></line>
        `;
      }).join("")}


      ${bars}


      <path
        class="chart-line"
        d="${smooth(adoptionPoints)}"
      ></path>


      <path
        class="chart-line-amber"
        d="${smooth(reviewPoints)}"
      ></path>


      ${ADOPTION_SERIES.map((item,index) => `
        <text
          class="axis-label"
          text-anchor="middle"
          x="${left+index*slot+slot*.43}"
          y="${height-8}"
        >
          ${item.p}
        </text>
      `).join("")}

    </svg>
  `;
}

/* =========================================================
   SCENARIO CHART
========================================================= */

function scenarioChart(){
  const width = 650;
  const height = 245;
  const pad = 24;

  const colours = {
    base:"var(--blue)",
    accelerated:"var(--cyan)",
    reviewShock:"var(--red)",
    cautious:"var(--violet)"
  };


  return `
    <svg
      class="chart"
      viewBox="0 0 ${width} ${height}"
    >

      ${[50,100,150,200].map(y => `
        <line
          class="gridline"
          x1="${pad}"
          y1="${y}"
          x2="${width-pad}"
          y2="${y}"
        ></line>
      `).join("")}


      ${Object.entries(SCENARIOS).map(
        ([key,scenario]) => {

          const points =
            scenario.adoption.map(
              (value,index) => [
                pad +
                index /
                (scenario.adoption.length-1) *
                (width-pad*2),

                height -
                pad -
                ((value-45)/55) *
                (height-pad*2)
              ]
            );

          return `
            <path
              class="chart-line"
              style="
                stroke:${colours[key]};
                stroke-width:${
                  key === state.scenario
                    ? 4
                    : 2
                };
                opacity:${
                  key === state.scenario
                    ? 1
                    : .32
                }
              "
              d="${smooth(points)}"
            ></path>
          `;
        }
      ).join("")}

    </svg>
  `;
}

    });
}


/* =========================================================
   TOOLTIPS
========================================================= */

function bindTooltips(){
  const tooltip =
    document.getElementById("tooltip");


  document.querySelectorAll("[data-tip]")
    .forEach(element => {

      element.onmouseenter = event => {
        tooltip.innerHTML =
          element.dataset.tip;

        tooltip.style.display =
          "block";

        moveTooltip(
          event,
          tooltip
        );
      };


      element.onmousemove = event => {
        moveTooltip(
          event,
          tooltip
        );
      };


      element.onmouseleave = () => {
        tooltip.style.display =
          "none";
      };

    });
}


function moveTooltip(event,tooltip){
  const gap = 14;
  const padding = 10;

  const rect =
    tooltip.getBoundingClientRect();

  let left =
    event.clientX + gap;

  let top =
    event.clientY + gap;


  if(
    left +
    rect.width +
    padding >
    window.innerWidth
  ){
    left =
      event.clientX -
      rect.width -
      gap;
  }


  if(
    top +
    rect.height +
    padding >
    window.innerHeight
  ){
    top =
      event.clientY -
      rect.height -
      gap;
  }


  tooltip.style.left =
    Math.max(
      padding,
      left
    ) + "px";


  tooltip.style.top =
    Math.max(
      padding,
      top
    ) + "px";
}


/* =========================================================

========================================================= */

function render(){

  const main =

  if(state.view === "command"){

  }

  else{

  bindDynamic();
  bindTooltips();
}
